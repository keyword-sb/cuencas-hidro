name: Datos de cuencas
on:
  schedule:
    # Horas en UTC (Ecuador = UTC-5). A los :07 y :37: GitHub atrasa o salta los cron cerca de la hora en punto
    # (con :10 corría cada ~5 h).
    # De día (06:00 a 22:00 de Ecuador), cada 30 min, lo que tarda CENACE en actualizar.
    - cron: "7,37 0-2,11-23 * * *"
    # De noche casi nadie lo ve: cada 2 h (23:37, 01:37, 03:37 y 05:37 de Ecuador). 36 corridas al día en total.
    - cron: "37 4,6,8,10 * * *"
  workflow_dispatch: {}
concurrency: tablero
jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # historial_cenace.json guarda las lecturas anteriores de CENACE: restando dos lecturas del mismo día sale la
      # producción actual. Cada corrida empieza limpia, así que se trae el de la corrida anterior. Un caché no se puede
      # sobrescribir: cada corrida guarda uno nuevo y se restaura el más reciente con el prefijo.
      - name: Traer historial de CENACE
        uses: actions/cache/restore@v4
        with:
          path: historial_cenace.json
          key: historial-cenace-${{ github.run_id }}
          restore-keys: historial-cenace-
      - run: python3 hidro.py
      - name: Guardar historial de CENACE
        if: always() && hashFiles('historial_cenace.json') != ''
        uses: actions/cache/save@v4
        with:
          path: historial_cenace.json
          key: historial-cenace-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # Publica solo public/datos.json en el proyecto de Vercel cuencas-hidro (team adm1n-s-projects).
      # El módulo "Cuencas" del Monitor Energía de Keyword lo lee desde ahí.
      - name: Publicar en Vercel
        run: npx --yes vercel@65.1.0 deploy public --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Si alguna fuente falló, los datos igual se publican con lo demás. La corrida queda en rojo (y GitHub manda
      # correo) solo si cayó CELEC o CENACE; las demás fuentes quedan listadas en el log y en datos.json → errores.
      - name: Revisar fuentes
        run: python3 -c "import json,sys; e=json.load(open('datos.json'))['errores']; print(json.dumps(e, indent=1, ensure_ascii=False)); sys.exit(1 if any(k.startswith(('celec','cenace')) for k in e) else 0)"
